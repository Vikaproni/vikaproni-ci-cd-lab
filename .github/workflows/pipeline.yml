name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HTML lint
        run: |
          npm install -g htmlhint
          htmlhint index.html

      - name: Build image
        if: always()
        run: docker build -t site:test .


      - name: Smoke test container
        if: always()
        run: |
        run: |
          set -x
          docker run -d --name test-site -p 8080:80 site:test
          sleep 5
          curl -s http://localhost:8080 > page.html
          grep -q "</h1>" page.html
          grep -q "Vikaproni" page.html
          echo "OK"

      - name: Cleanup
        if: always()
        run: docker rm -f test-site || true


  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/vikaproni/vikaproni-ci-cd-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest